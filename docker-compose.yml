services:
  postgres:
    image: postgres:15-alpine
    env_file:
      - .env.runtime
    volumes:
      - bottrading-postgres-data:/var/lib/postgresql/data
    networks:
      - bottrading-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    env_file:
      - .env.runtime
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - bottrading-redis-data:/data
    networks:
      - bottrading-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  bottrading-api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.runtime
    environment:
      NODE_ENV: production
      PORT: "3001"
      TRADING_MODE: PAPER
      LIVE_TRADING_ENABLED: "false"
      PAPER_COLD_START_ENABLED: "false"
      ENABLE_BINANCE_MARKET_STREAMS: "true"
      BINANCE_WS_MAX_STREAMS_PER_SHARD: "80"
      BINANCE_WS_MAX_URL_BYTES: "6000"
      BINANCE_WS_MAX_SHARDS: "64"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "3001:3001"
    networks:
      - bottrading-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3001/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

networks:
  bottrading-net:
    name: bottrading-net
    driver: bridge
    internal: false

volumes:
  bottrading-postgres-data:
    name: bottrading-postgres-data
  bottrading-redis-data:
    name: bottrading-redis-data
