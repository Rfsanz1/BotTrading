version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
    command: ["pnpm", "--dir", "packages/database", "run", "migrate:deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      REDIS_URL: ${REDIS_URL:?required}
      NODE_ENV: production
      PORT: ${API_PORT:-3001}
      TRADING_MODE: PAPER
      TESTNET_EXCHANGE_ACCOUNT_ID: ${TESTNET_EXCHANGE_ACCOUNT_ID:?required}
      LIVE_TRADING_ENABLED: "false"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?required}
      JWT_ISSUER: ${JWT_ISSUER:?required}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?required}
      LIVE_EXCHANGE_ACCOUNT_ID: ${LIVE_EXCHANGE_ACCOUNT_ID:?required}
      RISK_CONFIG_VERSION: ${RISK_CONFIG_VERSION:?required}
      TRADING_MIN_ACCOUNT_BALANCE_USD: ${TRADING_MIN_ACCOUNT_BALANCE_USD:?required}
      TRADING_MAX_ORDER_VALUE_USD: ${TRADING_MAX_ORDER_VALUE_USD:?required}
      TRADING_DAILY_LOSS_LIMIT_USD: ${TRADING_DAILY_LOSS_LIMIT_USD:?required}
      TRADING_MAX_POSITION_SIZE_PERCENT: ${TRADING_MAX_POSITION_SIZE_PERCENT:?required}
      TRADING_MAX_CONCURRENT_POSITIONS: ${TRADING_MAX_CONCURRENT_POSITIONS:?required}
      EXCHANGE_CREDENTIAL_ENCRYPTION_KEY: ${EXCHANGE_CREDENTIAL_ENCRYPTION_KEY:?required}
      WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET:?required}
      WEBHOOK_USER_ID: ${WEBHOOK_USER_ID:?required}
      CORS_ORIGIN: ${CORS_ORIGIN:?required}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-3}
      AI_RETRY_DELAY_MS: ${AI_RETRY_DELAY_MS:-1000}
      PAPER_COLD_START_ENABLED: "false"
      TRADING_SPOT_TAKER_FEE_RATE: ${TRADING_SPOT_TAKER_FEE_RATE:-}
      TRADING_FUTURES_TAKER_FEE_RATE: ${TRADING_FUTURES_TAKER_FEE_RATE:-}
      TRADING_EXPECTED_HOLDING_TIME_MS: ${TRADING_EXPECTED_HOLDING_TIME_MS:-28800000}
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    command: ["node", "dist/main.js"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:${API_PORT:-3001}/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
