version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-rfsanz}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rfsanz}}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379}
      NODE_ENV: production
      PORT: ${API_PORT:-3001}
      TRADING_MODE: ${TRADING_MODE:-PAPER}
      TESTNET_EXCHANGE_ACCOUNT_ID: ${TESTNET_EXCHANGE_ACCOUNT_ID-}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
      EXCHANGE_CREDENTIAL_ENCRYPTION_KEY: ${EXCHANGE_CREDENTIAL_ENCRYPTION_KEY:?required}
      WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET:?required}
      WEBHOOK_USER_ID: ${WEBHOOK_USER_ID:?required}
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:${API_PORT:-3001}/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
